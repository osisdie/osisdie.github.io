  <!-- Headline (2 lines) -->
  <text x="100" y="175" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif' font-size="54" font-weight="800" fill="#073642" letter-spacing="-1px">&#19968;&#34892; <tspan font-family='"JetBrains Mono", "Consolas", monospace' fill="#268BD2">/handoff</tspan></text>
  <text x="100" y="235" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif' font-size="54" font-weight="800" fill="#073642" letter-spacing="-1px">&#25226; 5 &#20491;&#27493;&#39538;&#25974;&#24179;&#25104;&#19968;&#20491;&#21205;&#35422;</text>

