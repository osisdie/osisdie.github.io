  <text x="200" y="424" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#93A1A1">&#9656;</text>
  <text x="400" y="424" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#93A1A1">&#9656;</text>
  <text x="600" y="424" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#93A1A1">&#9656;</text>
  <text x="800" y="424" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#93A1A1">&#9656;</text>
