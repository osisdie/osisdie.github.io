<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- layout: cream -->
  <rect width="1200" height="630" fill="#FDF6E3"/>

  <!-- Category (top-left) + accent rule -->
  <text x="100" y="92" font-family='"JetBrains Mono", "Consolas", "Menlo", monospace' font-size="18" font-weight="700" fill="#CB4B16" letter-spacing="2px">LLM SERVING &#183; TUNING</text>
  <line x1="100" y1="108" x2="240" y2="108" stroke="#CB4B16" stroke-width="3"/>

  <!-- Blog wordmark (top-right) -->
  <text x="1100" y="92" text-anchor="end" font-family='"JetBrains Mono", "Consolas", "Menlo", monospace' font-size="14" font-weight="500" fill="#93A1A1" letter-spacing="0.5px">Kevin&#8217;s Tech Blog</text>

  <!-- Headline (2 lines) -->
  <text x="100" y="225" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif' font-size="68" font-weight="800" fill="#073642" letter-spacing="-1px">6.7&#215; TTFT</text>
  <text x="100" y="305" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif' font-size="68" font-weight="800" fill="#073642" letter-spacing="-1px">4.2&#215; decode</text>

  <!-- Sub-hook -->
  <text x="100" y="365" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif' font-size="24" font-weight="500" fill="#586E75">2&#215; DGX Spark &#183; Ray Serve + vLLM &#183; Tier-1 &#8594; Tier-2 tuning playbook</text>

  <!-- Scorecard table -->
  <g transform="translate(100, 395)">
    <rect x="0" y="0" width="1000" height="180" rx="12" fill="#073642"/>

    <!-- Header row -->
    <text x="24" y="26" font-family='"JetBrains Mono", "Consolas", "Menlo", monospace' font-size="13" font-weight="600" fill="#93A1A1" letter-spacing="1px">SCORECARD</text>
    <text x="420" y="26" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", "Menlo", monospace' font-size="13" font-weight="700" fill="#93A1A1" letter-spacing="1px">BASELINE</text>
    <text x="660" y="26" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", "Menlo", monospace' font-size="13" font-weight="700" fill="#86efac" letter-spacing="1px">AFTER</text>
    <text x="880" y="26" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", "Menlo", monospace' font-size="13" font-weight="700" fill="#fb923c" letter-spacing="1px">&#916;</text>

    <!-- Top divider -->
    <line x1="24" y1="38" x2="976" y2="38" stroke="#475569" stroke-width="1" opacity="0.4"/>

    <!-- Row 1: Cached TTFT -->
    <text x="24" y="62" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' font-size="17" font-weight="700" fill="#FDF6E3">Cached-prompt TTFT</text>
    <text x="420" y="62" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", monospace' font-size="18" font-weight="700" fill="#93A1A1">1.0&#215;</text>
    <text x="660" y="62" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", monospace' font-size="18" font-weight="700" fill="#86efac">cached</text>
    <text x="880" y="62" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", monospace' font-size="17" font-weight="700" fill="#fb923c">&#215; 6.7</text>

    <!-- Row 2: Throughput @ c=16 -->
    <text x="24" y="88" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' font-size="17" font-weight="700" fill="#FDF6E3">Throughput @ c=16</text>
    <text x="420" y="88" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", monospace' font-size="18" font-weight="700" fill="#93A1A1">36 t/s</text>
    <text x="660" y="88" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", monospace' font-size="18" font-weight="700" fill="#86efac">104 t/s</text>
    <text x="880" y="88" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", monospace' font-size="17" font-weight="700" fill="#fb923c">&#215; 2.76</text>

    <!-- Row 3: Decode latency (Tier-2) -->
    <text x="24" y="114" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' font-size="17" font-weight="700" fill="#FDF6E3">Decode latency (Tier-2)</text>
    <text x="420" y="114" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", monospace' font-size="18" font-weight="700" fill="#93A1A1">277 ms/tok</text>
    <text x="660" y="114" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", monospace' font-size="18" font-weight="700" fill="#fcd34d">66 ms/tok</text>
    <text x="880" y="114" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", monospace' font-size="17" font-weight="700" fill="#fb923c">&#215; 4.2</text>

    <!-- Row 4: Architecture change -->
    <text x="24" y="140" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' font-size="17" font-weight="700" fill="#FDF6E3">Architecture change (Tier-1)</text>
    <text x="420" y="140" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", monospace' font-size="18" font-weight="700" fill="#93A1A1">&#8212;</text>
    <text x="660" y="140" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", monospace' font-size="18" font-weight="700" fill="#86efac">engine_kwargs</text>
    <text x="880" y="140" text-anchor="middle" font-family='"JetBrains Mono", "Consolas", monospace' font-size="17" font-weight="700" fill="#86efac">0</text>

    <!-- Bottom divider -->
    <line x1="24" y1="152" x2="976" y2="152" stroke="#475569" stroke-width="1" opacity="0.3"/>

    <!-- Verdict footer -->
    <text x="24" y="170" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif' font-size="13" font-weight="600" fill="#86efac">&#9733; default = always-on, 1 model per node</text>
    <text x="976" y="170" text-anchor="end" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif' font-size="13" font-weight="500" fill="#93A1A1">Tier-1 first &#183; Tier-2 if you must</text>
  </g>

  <!-- Meta (bottom-left) -->
  <text x="100" y="600" font-family='"JetBrains Mono", "Consolas", "Menlo", monospace' font-size="14" font-weight="500" fill="#93A1A1" letter-spacing="0.5px">@osisdie &#183; 2026.05.10</text>

  <!-- Bottom attribution -->
  <g opacity="0.45">
    <text x="600" y="618" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5px">osisdie.github.io &#183; dgx-spark ray-serve tuning</text>
  </g>
</svg>
