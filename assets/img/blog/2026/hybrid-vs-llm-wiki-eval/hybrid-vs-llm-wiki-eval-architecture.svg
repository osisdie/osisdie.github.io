<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- layout: hybrid -->
  <defs>
    <linearGradient id="transitionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="detailBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect y="390" width="1200" height="240" fill="url(#detailBgGrad)"/>
  <rect y="370" width="1200" height="30" fill="url(#transitionGrad)"/>

  <!-- === HEAD ZONE === -->
  <text x="600" y="62" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans TC, sans-serif"
        font-size="32" font-weight="700" fill="#1e293b">
    Hybrid RAG vs LLM-Wiki · 13-Question A/B
  </text>
  <text x="600" y="98" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="18" font-weight="600" fill="#475569">
    Same 60-page knowledge base · same persona · only retrieval differs
  </text>
  <line x1="260" y1="120" x2="940" y2="120" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 2 head-to-head comparison cards -->

  <!-- LEFT: Hybrid (winner — green) -->
  <g transform="translate(310, 250)">
    <rect x="-200" y="-100" width="400" height="200" rx="16" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
    <text x="0" y="-58" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="26" font-weight="800" fill="#166534">Hybrid &#9733;</text>
    <text x="0" y="-30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#15803d">BM25 + dense + RRF</text>

    <text x="-180" y="0" font-family="sans-serif" font-size="15" font-weight="700" fill="#15803d">Accuracy</text>
    <text x="180" y="0" text-anchor="end" font-family='"JetBrains Mono", monospace' font-size="15" font-weight="700" fill="#166534">13/13  (100%)</text>

    <text x="-180" y="22" font-family="sans-serif" font-size="15" font-weight="700" fill="#15803d">Avg tokens</text>
    <text x="180" y="22" text-anchor="end" font-family='"JetBrains Mono", monospace' font-size="15" font-weight="700" fill="#166534">1,407</text>

    <text x="-180" y="44" font-family="sans-serif" font-size="15" font-weight="700" fill="#15803d">Latency p50</text>
    <text x="180" y="44" text-anchor="end" font-family='"JetBrains Mono", monospace' font-size="15" font-weight="700" fill="#166534">3.3 s</text>

    <text x="-180" y="66" font-family="sans-serif" font-size="15" font-weight="700" fill="#15803d">LLM calls</text>
    <text x="180" y="66" text-anchor="end" font-family='"JetBrains Mono", monospace' font-size="15" font-weight="700" fill="#166534">2</text>

    <rect x="-60" y="80" width="120" height="22" rx="11" fill="#16a34a"/>
    <text x="0" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Default</text>
  </g>

  <!-- RIGHT: LLM-Wiki (orange — costly) -->
  <g transform="translate(890, 250)">
    <rect x="-200" y="-100" width="400" height="200" rx="16" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
    <text x="0" y="-58" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="26" font-weight="800" fill="#9a3412">LLM-Wiki</text>
    <text x="0" y="-30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#c2410c">Pre-synthesized markdown wiki</text>

    <text x="-180" y="0" font-family="sans-serif" font-size="15" font-weight="700" fill="#c2410c">Accuracy</text>
    <text x="180" y="0" text-anchor="end" font-family='"JetBrains Mono", monospace' font-size="15" font-weight="700" fill="#9a3412">12/13  (92.3%)</text>

    <text x="-180" y="22" font-family="sans-serif" font-size="15" font-weight="700" fill="#c2410c">Avg tokens</text>
    <text x="180" y="22" text-anchor="end" font-family='"JetBrains Mono", monospace' font-size="15" font-weight="700" fill="#9a3412">13,055  (×9.3)</text>

    <text x="-180" y="44" font-family="sans-serif" font-size="15" font-weight="700" fill="#c2410c">Latency p50</text>
    <text x="180" y="44" text-anchor="end" font-family='"JetBrains Mono", monospace' font-size="15" font-weight="700" fill="#9a3412">8.2 s  (×2.5)</text>

    <text x="-180" y="66" font-family="sans-serif" font-size="15" font-weight="700" fill="#c2410c">LLM calls</text>
    <text x="180" y="66" text-anchor="end" font-family='"JetBrains Mono", monospace' font-size="15" font-weight="700" fill="#9a3412">4</text>

    <rect x="-60" y="80" width="120" height="22" rx="11" fill="#ea580c"/>
    <text x="0" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Opt-in</text>
  </g>

  <!-- === DETAIL ZONE: Three Wiki failure modes === -->
  <text x="600" y="420" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="16" font-weight="700" fill="#cbd5e1">Three Wiki Failure Modes Blocking Default Promotion</text>

  <!-- Failure 1: Cross-tenant contamination (Red - serious) -->
  <g transform="translate(40, 450)">
    <rect x="0" y="0" width="1120" height="46" rx="10" fill="#1e293b" stroke="#dc2626" stroke-width="2"/>
    <rect x="0" y="0" width="120" height="46" rx="10" fill="#dc2626"/>
    <text x="60" y="29" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff" letter-spacing="0.5px">SERIOUS</text>
    <text x="140" y="22" font-family="sans-serif" font-size="15" font-weight="700" fill="#fca5a5">Cross-tenant contamination</text>
    <text x="140" y="40" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Page synthesis merged tenants &#8594; Wiki cited tenant B&#8217;s policy at 0.9 confidence when asked about tenant A</text>
  </g>

  <!-- Failure 2: Language pollution (Yellow - baked-in) -->
  <g transform="translate(40, 506)">
    <rect x="0" y="0" width="1120" height="46" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
    <rect x="0" y="0" width="120" height="46" rx="10" fill="#facc15"/>
    <text x="60" y="29" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="0.5px">BAKED-IN</text>
    <text x="140" y="22" font-family="sans-serif" font-size="15" font-weight="700" fill="#fde68a">Language pollution welded to wiki</text>
    <text x="140" y="40" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Page synthesis introduced foreign-language tokens into a Chinese page; every query reproduces the noise verbatim</text>
  </g>

  <!-- Failure 3: Paraphrase over-simplification (Orange - subtle) -->
  <g transform="translate(40, 562)">
    <rect x="0" y="0" width="1120" height="46" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
    <rect x="0" y="0" width="120" height="46" rx="10" fill="#fb923c"/>
    <text x="60" y="29" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="0.5px">SUBTLE</text>
    <text x="140" y="22" font-family="sans-serif" font-size="15" font-weight="700" fill="#fed7aa">Paraphrase over-simplification</text>
    <text x="140" y="40" font-family="sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">ANSWER prompt mirrors the brevity of paraphrase queries &#8594; drops constraints; binary accuracy misses it, only fact-recall catches it</text>
  </g>

  <!-- Bottom attribution -->
  <g opacity="0.45">
    <text x="600" y="624" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5px">osisdie.github.io · hybrid vs llm-wiki eval</text>
  </g>
</svg>
