<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- layout: cream -->
  <rect width="1200" height="630" fill="#FDF6E3"/>

  <!-- Category (top-left) + accent rule -->
  <text x="100" y="92" font-family='"JetBrains Mono", "Consolas", "Menlo", monospace' font-size="18" font-weight="700" fill="#CB4B16" letter-spacing="2px">RAG · A/B EVAL</text>
  <line x1="100" y1="108" x2="200" y2="108" stroke="#CB4B16" stroke-width="3"/>

  <!-- Blog wordmark (top-right) -->
  <text x="1100" y="92" text-anchor="end" font-family='"JetBrains Mono", "Consolas", "Menlo", monospace' font-size="14" font-weight="500" fill="#93A1A1" letter-spacing="0.5px">Kevin&#8217;s Tech Blog</text>

  <!-- Headline (2 lines) -->
  <text x="100" y="225" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif' font-size="68" font-weight="800" fill="#073642" letter-spacing="-1px">Hybrid 還是</text>
  <text x="100" y="305" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif' font-size="68" font-weight="800" fill="#073642" letter-spacing="-1px">LLM-Wiki?</text>

  <!-- Sub-hook -->
  <text x="100" y="365" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif' font-size="24" font-weight="500" fill="#586E75">13 題 A/B · 60 篇知識庫 · 同一 persona · 只換 retrieval</text>

  <!-- Punchline scorecard -->
  <g transform="translate(100, 460)">
    <rect x="0" y="-40" width="780" height="100" rx="12" fill="#073642"/>
    <text x="24" y="-15" font-family='"JetBrains Mono", "Consolas", "Menlo", monospace' font-size="13" font-weight="600" fill="#93A1A1" letter-spacing="1px">SCORECARD</text>
    <text x="24" y="14" font-family='"JetBrains Mono", "Consolas", "Menlo", monospace' font-size="20" font-weight="700">
      <tspan fill="#86efac">Hybrid 13/13</tspan><tspan fill="#93A1A1">  ·  </tspan><tspan fill="#fcd34d">Wiki 12/13</tspan><tspan fill="#93A1A1">  ·  </tspan><tspan fill="#FDF6E3">tokens ×9.3</tspan>
    </text>
    <text x="24" y="42" font-family='"JetBrains Mono", "Consolas", "Menlo", monospace' font-size="20" font-weight="700">
      <tspan fill="#FDF6E3">latency p50 ×2.5  ·  LLM calls 2 vs 4  ·  </tspan><tspan fill="#86efac">default = Hybrid</tspan>
    </text>
  </g>

  <!-- Side verdict -->
  <text x="910" y="442" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif' font-size="20" font-weight="700" fill="#073642">Wiki 還不能</text>
  <text x="910" y="472" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif' font-size="20" font-weight="700" fill="#073642">換 default</text>
  <text x="910" y="510" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif' font-size="14" font-weight="500" fill="#586E75">v2 修跨 tenant 串味</text>

  <!-- Meta (bottom-left) -->
  <text x="100" y="585" font-family='"JetBrains Mono", "Consolas", "Menlo", monospace' font-size="16" font-weight="500" fill="#93A1A1" letter-spacing="0.5px">@osisdie &#183; 2026.05.06</text>

  <!-- Bottom attribution -->
  <g opacity="0.45">
    <text x="600" y="618" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5px">osisdie.github.io · hybrid vs llm-wiki eval</text>
